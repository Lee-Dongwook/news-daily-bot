name: 📰 Multi-News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "30 2 * * *"
    - cron: "0 4 * * *"
    - cron: "30 6 * * *"
    - cron: "0 8 * * *"
    - cron: "30 10 * * *"
    - cron: "0 12 * * *"
    - cron: "30 14 * * *"
    - cron: "0 16 * * *"
    - cron: "30 18 * * *"
    - cron: "0 20 * * *"
    - cron: "30 22 * * *"

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Fetch news from multiple sources
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python <<EOF
          import json
          import requests
          import feedparser
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          import random

          tz = ZoneInfo("Asia/Tehran")
          now = datetime.now(tz)
          date_str = now.strftime("%Y-%m-%d")
          time_str = now.strftime("%H-%M")

          all_news = []

          # ====== SOURCE 1: NewsAPI (from GitHub Secrets) ======
          API_KEY = os.environ.get("NEWS_API_KEY", "")
          categories = ["technology", "science", "health", "business", "entertainment", "sports"]
          
          for category in categories:
              if API_KEY:
                  try:
                      url = f"https://newsapi.org/v2/top-headlines?country=us&category={category}&apiKey={API_KEY}&pageSize=2"
                      response = requests.get(url, timeout=10)
                      data = response.json()
                      
                      if data.get("status") == "ok":
                          for article in data.get("articles", []):
                              all_news.append({
                                  "source": "NewsAPI",
                                  "category": category,
                                  "title": article.get("title", "No title"),
                                  "description": article.get("description", ""),
                                  "url": article.get("url", "#"),
                                  "published": article.get("publishedAt", ""),
                                  "fetched": now.isoformat(timespec="seconds")
                              })
                      else:
                          print(f"NewsAPI {category} error: {data.get('message', 'Unknown error')}")
                  except Exception as e:
                      print(f"NewsAPI {category} exception: {e}")
              else:
                  print("⚠️ NEWS_API_KEY not found in environment variables")

          # ====== SOURCE 2: Hacker News (no API key needed) ======
          try:
              hn_url = "https://hnrss.org/frontpage?count=5"
              hn_data = feedparser.parse(hn_url)
              for entry in hn_data.entries[:3]:
                  all_news.append({
                      "source": "Hacker News",
                      "category": "technology",
                      "title": entry.get("title", "No title"),
                      "description": entry.get("summary", ""),
                      "url": entry.get("link", "#"),
                      "published": entry.get("published", ""),
                      "fetched": now.isoformat(timespec="seconds")
                  })
          except Exception as e:
              print(f"Hacker News error: {e}")

          # ====== SOURCE 3: Reuters RSS (no API key needed) ======
          try:
              reuters_url = "https://feeds.reuters.com/Reuters/worldNews"
              reuters_data = feedparser.parse(reuters_url)
              for entry in reuters_data.entries[:3]:
                  all_news.append({
                      "source": "Reuters",
                      "category": "world",
                      "title": entry.get("title", "No title"),
                      "description": entry.get("summary", ""),
                      "url": entry.get("link", "#"),
                      "published": entry.get("published", ""),
                      "fetched": now.isoformat(timespec="seconds")
                  })
          except Exception as e:
              print(f"Reuters error: {e}")

          # ====== SOURCE 4: BBC RSS (no API key needed) ======
          try:
              bbc_url = "http://feeds.bbci.co.uk/news/rss.xml"
              bbc_data = feedparser.parse(bbc_url)
              for entry in bbc_data.entries[:3]:
                  all_news.append({
                      "source": "BBC",
                      "category": "world",
                      "title": entry.get("title", "No title"),
                      "description": entry.get("summary", ""),
                      "url": entry.get("link", "#"),
                      "published": entry.get("published", ""),
                      "fetched": now.isoformat(timespec="seconds")
                  })
          except Exception as e:
              print(f"BBC error: {e}")

          # ====== SOURCE 5: Al Jazeera RSS (no API key needed) ======
          try:
              aj_url = "https://www.aljazeera.com/xml/rss/all.xml"
              aj_data = feedparser.parse(aj_url)
              for entry in aj_data.entries[:3]:
                  all_news.append({
                      "source": "Al Jazeera",
                      "category": "world",
                      "title": entry.get("title", "No title"),
                      "description": entry.get("summary", ""),
                      "url": entry.get("link", "#"),
                      "published": entry.get("published", ""),
                      "fetched": now.isoformat(timespec="seconds")
                  })
          except Exception as e:
              print(f"Al Jazeera error: {e}")

          # ====== SOURCE 6: CoinGecko Crypto News (no API key) ======
          try:
              crypto_url = "https://api.coingecko.com/api/v3/news"
              crypto_response = requests.get(crypto_url, timeout=10)
              crypto_data = crypto_response.json()
              for article in crypto_data.get("data", [])[:3]:
                  all_news.append({
                      "source": "CoinGecko",
                      "category": "crypto",
                      "title": article.get("title", "No title"),
                      "description": article.get("description", ""),
                      "url": article.get("url", "#"),
                      "published": article.get("created_at", ""),
                      "fetched": now.isoformat(timespec="seconds")
                  })
          except Exception as e:
              print(f"CoinGecko error: {e}")

          # ====== SOURCE 7: NASA EONET (natural events) ======
          try:
              nasa_url = "https://eonet.gsfc.nasa.gov/api/v3/events?limit=5"
              nasa_response = requests.get(nasa_url, timeout=10)
              nasa_data = nasa_response.json()
              for event in nasa_data.get("events", [])[:3]:
                  all_news.append({
                      "source": "NASA",
                      "category": "nature",
                      "title": event.get("title", "No title"),
                      "description": f"Natural event: {event.get('categories', [{}])[0].get('title', 'Unknown')}",
                      "url": event.get("link", "#"),
                      "published": event.get("geometry", [{}])[0].get("date", ""),
                      "fetched": now.isoformat(timespec="seconds")
                  })
          except Exception as e:
              print(f"NASA error: {e}")

          # ====== SAVE NEWS TO FILE ======
          os.makedirs(f"news/{date_str}", exist_ok=True)
          filename = f"news/{date_str}/{time_str}.json"
          
          news_data = {
              "update_time": now.isoformat(timespec="seconds"),
              "timezone": "Asia/Tehran",
              "total_news": len(all_news),
              "sources_used": list(set([n["source"] for n in all_news])),
              "news": all_news
          }
          
          with open(filename, "w", encoding="utf8") as f:
              json.dump(news_data, f, indent=4, ensure_ascii=False)

          # ====== UPDATE README ======
          readme = f"""# 📰 Daily News Bot - 12+ Commits Daily

This bot fetches news **12 times per day** from multiple sources.

## 🕐 Latest Update
- **Time:** {now.strftime('%Y-%m-%d %H:%M:%S')}
- **Timezone:** Asia/Tehran
- **Total News:** {len(all_news)}
- **Sources:** {', '.join(set([n['source'] for n in all_news]))}

## 📊 Today's Stats
- **Files today:** {len(os.listdir(f'news/{date_str}')) if os.path.exists(f'news/{date_str}') else 0}
- **Commits today:** {len(os.listdir(f'news/{date_str}')) if os.path.exists(f'news/{date_str}') else 0}

## 🔥 Latest Headlines

"""
          for i, news in enumerate(all_news[:5], 1):
              readme += f"""
{i}. **[{news['source']}]** {news['title']}
   - 📝 {news['description'][:100]}...
   - 🔗 [Read more]({news['url']})
"""

          readme += f"""

---
## 📂 File Structure

```

news/
└── {date_str}/
├── 00-00.json
├── 02-30.json
└── ...

```

## 🎯 Sources Used
- NewsAPI (from GitHub Secrets)
- Hacker News (RSS)
- Reuters (RSS)
- BBC (RSS)
- Al Jazeera (RSS)
- CoinGecko (Crypto)
- NASA EONET (Natural Events)

---
**Built with ❤️ by GitHub Actions**
"""

          with open("README.md", "w", encoding="utf8") as f:
              f.write(readme)

          # ====== CREATE COMMIT LOG ======
          log_entry = f"{now.isoformat(timespec='seconds')} | {len(all_news)} news | {len(set([n['source'] for n in all_news]))} sources"
          
          with open("commit-log.txt", "a", encoding="utf8") as f:
              f.write(f"{log_entry}\n")

          # ====== DAILY STATS ======
          os.makedirs("stats", exist_ok=True)
          stats_file = f"stats/{date_str}.json"
          
          try:
              with open(stats_file, "r", encoding="utf8") as f:
                  stats = json.load(f)
          except FileNotFoundError:
              stats = {"date": date_str, "commits": [], "total_news": 0}
          
          stats["commits"].append({
              "time": time_str,
              "news_count": len(all_news),
              "sources": list(set([n['source'] for n in all_news]))
          })
          stats["total_news"] += len(all_news)
          
          with open(stats_file, "w", encoding="utf8") as f:
              json.dump(stats, f, indent=4, ensure_ascii=False)

          print(f"✅ Saved {len(all_news)} news items")
          EOF

      - name: Commit and Push
        run: |
          git config user.name "VIDAKHOSHPEY22"
          git config user.email "vidatwin18@gmail.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          TIME=$(date '+%Y-%m-%d %H:%M:%S')
          COUNT=$(ls -1 news/$(date '+%Y-%m-%d')/*.json 2>/dev/null | wc -l || echo "0")
          
          git commit -m "📰 News update #$COUNT - $TIME"
          git push
