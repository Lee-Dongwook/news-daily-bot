name: 📰 Multi-News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"
    - cron: "30 */1 * * *"

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch news from multiple sources
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scripts/fetch_news.py

      - name: Commit and Push
        run: |
          git config user.name "VIDAKHOSHPEY22"
          git config user.email "vidatwin18@gmail.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          TIME=$(date '+%Y-%m-%d %H:%M:%S')
          COUNT=$(ls -1 news/$(date '+%Y-%m-%d')/*.json 2>/dev/null | wc -l || echo "0")

          git commit -m "📰 News update #$COUNT - $TIME"
          git push
